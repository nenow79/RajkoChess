name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chess_app_test
          POSTGRES_USER: chess_app
          POSTGRES_PASSWORD: chess_app_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess_app -d chess_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: chess_app_test
      POSTGRES_USER: chess_app
      POSTGRES_PASSWORD: chess_app_test_password
      POSTGRES_SSLMODE: disable
      POSTGRES_CONNECT_TIMEOUT: 5
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_KEY_SECRET: ci-rate-limit-secret-at-least-32-characters
      RUN_DATABASE_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Apply and validate migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Check infrastructure integrations
        working-directory: backend
        run: |
          python -m scripts.check_database
          python -m scripts.check_redis
          python -m scripts.check_rate_limits
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Type-check backend
        run: pyright --project pyrightconfig.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build
