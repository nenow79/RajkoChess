limit_req_zone $binary_remote_addr zone=rajko_api:10m rate=10r/s;

map $request_uri $rajko_auth_limit_key {
    default "";
    ~^/chess/api/auth/(login|register|email-verification/resend|password-reset/request)$ $binary_remote_addr;
}

limit_req_zone $rajko_auth_limit_key zone=rajko_auth:10m rate=30r/m;

server {
    listen 80;
    server_name rajko.pl www.rajko.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name rajko.pl www.rajko.pl;

    ssl_certificate /etc/letsencrypt/live/rajko.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajko.pl/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/rajko.pl/chain.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:RajkoChessSSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/rajko-chess;

    # Keep pgAdmin routing in the canonical, deployed vhost configuration.
    # The snippet owns both the /pgadmin redirect and reverse proxy settings.
    include /etc/nginx/snippets/pgadmin-proxy.conf;

    location = /chess {
        auth_basic "Rajko Chess";
        auth_basic_user_file /etc/nginx/rajko-chess.htpasswd;
        return 301 /chess/;
    }

    # Publiczny, bezstanowy endpoint dla zewnętrznego monitora dostępności.
    location = /chess/api/health {
        limit_req zone=rajko_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chess/api/ {
        auth_basic "Rajko Chess";
        auth_basic_user_file /etc/nginx/rajko-chess.htpasswd;

        limit_req zone=rajko_api burst=30 nodelay;
        limit_req zone=rajko_auth burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;

        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chess/ {
        auth_basic "Rajko Chess";
        auth_basic_user_file /etc/nginx/rajko-chess.htpasswd;

        try_files $uri $uri/ /chess/index.html;
    }
}
