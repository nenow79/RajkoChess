server {
    listen 80;
    listen [::]:80;
    server_name rajko.cloud www.rajko.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://rajko.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rajko.cloud;

    ssl_certificate /etc/letsencrypt/live/rajko.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajko.cloud/privkey.pem;

    return 301 https://rajko.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rajko.cloud;

    ssl_certificate /etc/letsencrypt/live/rajko.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajko.cloud/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/rajko.cloud/chain.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:RajkoCloudSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    root /var/www/rajko-cloud;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /chat {
        return 301 /chat/;
    }

    location ^~ /chat/ {
        auth_basic "Rajko Chat";
        auth_basic_user_file /etc/nginx/rajko-chess.htpasswd;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
